[project]
name = "bankrag"
version = "0.1.0"
description = "Multilingual RAG over Tunisian banking circulars, with cited answers, refusals and evaluation"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=4",
  "rank-bm25>=0.2",
  "numpy>=1.26",
  "fastembed>=0.4",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bankrag = "bankrag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
bankrag = ["static/*.html"]
